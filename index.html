function authView(){const l=S.mode==="login",r=S.mode==="register";

 S.msg=""}catch(x){$("#err").textContent=x.message}}}
const newSquad=(n,uid)=>addDoc(collection(db,"squads"),{name:n.trim(),nameLower:n.trim().toLowerCase(),managerIds:[uid],memberIds:[],active:true,createdBy:uid});
function schedule(){const T=allT(),up=T.filter(t=>t.status==="Upcoming"),done=T.filter(t=>t.status!=="Upcoming").reverse();

 return `<div class="card mb-3 ${played?"border-violet-500":""}"><div class="flex justify-between"><b>${esc(gname(t.gameId))}${t.tournamentName?" · "+esc(t.tournamentName):""}</b>

 <p class="text-sm text-gray-400">${fmt(t.scheduledTime)}${t.map?" · "+esc(t.map):""}${t.opponent?" · vs "+esc(t.opponent):""}</p>

 ${(played||(sq&&isM(sq)))&&(t.roomId||t.roomPassword)?`<p class="text-sm mt-1 text-green-400">🔑 Room ID: <b>${esc(t.roomId||"—")}</b> · Password: <b>${esc(t.roomPassword||"—")}</b></p>`:""}

 ${played?(rs[U()]?'<p class="text-xs text-green-400 mt-2">✔ You have submitted your kills & rating.</p>':`<form data-rate="${t.id}" class="grid grid-cols-2 gap-2 mt-2"><input name="k" type="number" min="0" max="999" class="inp" placeholder="Your total kills" required><select name="s" class="inp">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} ★</option>`).join("")}</select><input name="n" class="inp col-span-2" placeholder="Feedback note"><button class="btn col-span-2">Submit (one time only)</button></form>`):'<p class="text-xs text-gray-500">Only players in this match can submit kills & rating.</p>'}`:""}
 ${sq&&isM(sq)&&t.status==="Upcoming"?`<div class="flex gap-2 mt-2 flex-wrap"><button class="btn2" data-res="${t.id}|Win">Mark Win</button><button class="btn2" data-res="${t.id}|Loss">Mark Loss</button><button class="btn2" data-cancel="${t.id}">Cancel</button></div>`:""}</div>`};
 return `<h2 class="font-bold mb-2">Upcoming</h2>${up.map(card).join("")||'<p class="text-gray-500 mb-4">No upcoming matches.</p>'}<h2 class="font-bold my-2">Past</h2>${done.map(card).join("")||'<p class="text-gray-500">Nothing yet.</p>'}`}
function curSel(){return `<select id="cursq" class="inp mb-3">${mg().map(s=>`<option value="${s.id}" ${s.id===S.cur?"selected":""}>${esc(s.name)}${s.active?"":" (disabled)"}</option>`).join("")}</select>`}
function squads(){const reqs=mg().flatMap(s=>(S.rqBy[s.id]||[]));
 const mine=S.sqs.map(s=>`<div class="card mb-2"><div class="flex justify-between"><b>${esc(s.name)}</b><span class="text-xs">${isM(s)?"Manager":"Player"}${s.active?"":" · Disabled"}</span></div>

function create(){const s=S.sqs.find(x=>x.id===S.cur);if(!s)return '<p class="text-gray-500">Manage a team first (Teams tab).</p>';
 const ids=[...new Set([...s.managerIds,...s.memberIds])],opts=ids.map(i=>`<option value="${i}">${esc(uname(i))}${s.managerIds.includes(i)?" (manager)":""}</option>`).join("");
 return `${curSel()}<form id="cf" class="card space-y-3"><h2 class="font-bold">Schedule match for ${esc(s.name)}</h2>

function games(){const s=S.sqs.find(x=>x.id===S.cur);if(!s)return '<p class="text-gray-500">Manage a team first.</p>';
 return `${curSel()}<form id="gf" class="card space-y-3 mb-4"><h2 class="font-bold">Add game to ${esc(s.name)}</h2><input name="t" class="inp" placeholder="Game title" required>

 ${(S.gBy[s.id]||[]).map(g=>`<div class="card mb-2 flex items-center gap-3">${g.logo?`<img src="${esc(g.logo)}" class="w-10 h-10 rounded object-cover">`:"🎮"}<div><b>${esc(g.title)}</b><p class="text-xs text-gray-400">${esc((g.modes||[]).join(", "))}</p></div></div>`).join("")}`}
function calc(list){const d=list.filter(t=>t.status==="Completed"&&t.matchResult).sort((a,b)=>b.scheduledTime.toMillis()-a.scheduledTime.toMillis()),w=d.filter(t=>t.matchResult==="Win").length,n=d.length;
 let k=0;for(const t of d){if(t.matchResult===d[0].matchResult)k++;else break}
 const all=list.flatMap(t=>Object.values(t.ratings||{})),avg=all.length?all.reduce((a,r)=>a+r.stars,0)/all.length:0;
 return {n,w,l:n-w,rate:n?Math.round(w/n*100):0,streak:n?`${k}${d[0].matchResult[0]}`:"–",avg,cnt:all.length}}
function stats(){let list=allT();if(S.fsq!=="all")list=list.filter(t=>t.squadId===S.fsq);if(S.fg!=="all")list=list.filter(t=>t.gameId===S.fg);const c=calc(list),P={};list.filter(t=>t.status==="Completed").forEach(t=>[...t.starterUserIds,t.reserveUserId].forEach(i=>{const p=P[i]||(P[i]={m:0,k:0,r:0});p.m++;const x=(t.ratings||{})[i];if(x&&x.kills!=null){p.k+=x.kills;p.r++}}));
 const rows=Object.entries(P).sort((a,b)=>b[1].k-a[1].k),lb=rows.length?`<h2 class="font-bold mt-5 mb-1">Kills leaderboard</h2><div class="card"><table class="w-full text-sm"><tr class="text-gray-400 text-left"><th>Player</th><th>Matches</th><th>Kills</th><th>Avg</th></tr>${rows.map(([i,p],n)=>`<tr class="border-t border-[#232846]"><td class="py-2">${n===0&&p.k>0?"🏆 ":""}${esc(uname(i))}${rows.length>1&&n===rows.length-1?" ⬇":""}</td><td>${p.m}</td><td><b>${p.k}</b></td><td>${p.r?(p.k/p.r).toFixed(1):"–"}</td></tr>`).join("")}</table><p class="text-xs text-gray-500 mt-2">Kills are reported by players when they rate a match. 🏆 most · ⬇ least.</p></div>`:"";
 const box=(l,v,col="")=>`<div class="card text-center"><p class="text-2xl font-bold ${col}">${v}</p><p class="text-xs text-gray-400">${l}</p></div>`;

 return `<div class="grid grid-cols-2 gap-2 mb-3"><select id="fsq" class="inp"><option value="all">All my teams</option>${S.sqs.map(s=>`<option value="${s.id}" ${S.fsq===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select>
 <select id="fg" class="inp"><option value="all">All games</option>${allG().filter(g=>S.fsq==="all"||g.squadId===S.fsq).map(g=>`<option value="${g.id}" ${S.fg===g.id?"selected":""}>${esc(g.title)}</option>`).join("")}</select></div>
 <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${box("Current streak",c.streak,c.streak.endsWith("W")?"text-green-400":"text-red-400")}${box("Games played",c.n)}${box("Wins",c.w,"text-green-400")}${box("Losses",c.l,"text-red-400")}${box("Win rate",c.rate+"%")}${box("Avg rating",c.cnt?c.avg.toFixed(1)+" ★":"–","text-amber-400")}</div>

async function post(content){try{const w=(await getDoc(doc(db,"config","discord"))).data()?.webhook;if(!w)return" (Discord webhook not configured.)";

function bindMain(){const q=s=>document.querySelectorAll(s),on=(s,ev,fn)=>{const e=$(s);if(e)e[ev]=fn};
